name: Deploy MCP AI Agent

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mcp-ai-agent
  REGISTRY: sureshdocker-hnbwfchra7gtezhj.azurecr.io

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t $REGISTRY/$IMAGE_NAME:v1 .

    - name: Push Docker Image
      run: |
        docker push $REGISTRY/$IMAGE_NAME:v1

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Restart Azure Web App
      run: |
        az webapp restart \
          --resource-group rg-genai-learning \
          --name mcp-ai-agent-suresh